name: Ajustar cabeçalho compacto

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ajustar logo e altura do cabeçalho
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replaces = [
              (
                  '.hero{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#870608,var(--red),#720507);color:#fff;border-radius:26px;padding:18px;box-shadow:var(--shadow)}',
                  '.hero{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#870608,var(--red),#720507);color:#fff;border-radius:22px;padding:12px 18px;box-shadow:var(--shadow)}'
              ),
              (
                  '.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}',
                  '.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}'
              ),
              (
                  '.mark{width:132px;height:96px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000;flex:0 0 auto;box-shadow:0 6px 16px #0003}',
                  '.mark{width:158px;height:88px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000;flex:0 0 auto;box-shadow:0 6px 16px #0003}'
              ),
              (
                  '.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}',
                  '.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px}'
              ),
              (
                  '@media(max-width:620px){.app{padding:9px}.hero{padding:14px;border-radius:20px}.mark{width:108px;height:80px}.brand h1{font-size:21px}',
                  '@media(max-width:620px){.app{padding:9px}.hero{padding:10px 12px;border-radius:18px}.mark{width:124px;height:70px}.brand h1{font-size:20px}'
              ),
          ]

          changed = False
          for old, new in replaces:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
              elif new not in s:
                  raise SystemExit('Trecho esperado do cabeçalho não encontrado: ' + old[:80])

          if changed:
              p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/ajustar-cabecalho.yml
          git config user.name "Restaurante Abençoada Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Amplia logo e compacta cabeçalho do sistema"
          git push origin main