name: Publicar ajuste do cabeçalho

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disparar publicação do GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Remover automação temporária
        run: |
          rm -f .github/workflows/publicar-ajuste.yml
          git config user.name "Restaurante Abençoada Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Remove automação temporária de publicação"
          git push origin main