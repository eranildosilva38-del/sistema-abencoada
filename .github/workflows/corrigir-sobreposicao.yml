name: Corrigir sobreposição do cabeçalho

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  corrigir-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Corrigir sobreposição e publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_hero = '.hero{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#870608,var(--red),#720507);color:#fff;border-radius:22px;padding:12px 18px;box-shadow:var(--shadow)}'
          new_hero = '.hero{position:relative;z-index:20;background:linear-gradient(135deg,#870608,var(--red),#720507);color:#fff;border-radius:22px;padding:12px 18px;box-shadow:var(--shadow)}'
          if old_hero not in s:
              raise SystemExit('Trecho do cabeçalho não encontrado')
          s = s.replace(old_hero, new_hero, 1)

          old_cart = '.cart{position:sticky;top:142px;background:#ffffffeb;'
          new_cart = '.cart{position:sticky;top:18px;background:#ffffffeb;'
          if old_cart not in s:
              raise SystemExit('Trecho do carrinho não encontrado')
          s = s.replace(old_cart, new_cart, 1)

          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/corrigir-sobreposicao.yml
          git config user.name "Restaurante Abençoada Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Corrige sobreposição do cabeçalho sobre o cardápio"
          git push origin main
          gh workflow run deploy-pages.yml --ref main
