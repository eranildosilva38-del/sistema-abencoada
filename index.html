<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema Abençoada V4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4ead8;color:#31180e}
header{background:linear-gradient(#57260f,#321307);color:#fff;padding:14px;border-bottom:4px solid #b30c0c;position:sticky;top:0;z-index:10}
.brand{font-size:26px;font-weight:900}.tag{color:#ffd43b;font-style:italic}
nav,.cats{display:flex;gap:7px;overflow:auto;margin-top:10px}button{border:0;font:inherit;cursor:pointer}
nav button,.cat{padding:10px 13px;border-radius:10px;background:#fff0d7;font-weight:800;white-space:nowrap}nav .active,.cat.active{background:#b70b0b;color:#fff}
main{max-width:1200px;margin:auto;padding:12px}.screen{display:none}.screen.active{display:block}
.layout{display:grid;grid-template-columns:1.45fr .55fr;gap:12px}.panel{background:#fff9ec;border:1px solid #d8c19c;border-radius:15px;padding:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.product{padding:0;background:#fff;border:2px solid #d7b77f;border-radius:14px;overflow:hidden;text-align:left}
.product img{width:100%;height:210px;object-fit:cover;display:block}.info{padding:9px;background:#fff1d5}.name{font-weight:900;font-size:17px}.price{display:inline-block;background:#a90b0b;color:#fff;font-size:18px;font-weight:900;padding:6px 9px;border-radius:7px;margin-top:6px}
.line{padding:9px 0;border-bottom:1px solid #dec9a7}.small{font-size:12px;color:#6c5847}.total{font-size:27px;font-weight:900;margin:14px 0}
.payments{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pay,.secondary{padding:11px;border-radius:9px;background:#eadcc7;font-weight:800}.pay.selected{background:#362016;color:#fff}
.primary{padding:13px;border-radius:9px;background:#27883b;color:#fff;font-weight:900;width:100%;font-size:17px}
.ticketcard{background:#fff;border-left:7px solid #e36c00;border-radius:12px;padding:14px;margin-bottom:10px}.ticketcard.ready{border-left-color:#27883b}.ticket{font-size:38px;font-weight:900}
.readybox{border:3px solid #27883b;background:#fff;border-radius:15px;padding:20px;text-align:center;margin-bottom:10px}.readybox .ticket{font-size:60px}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:30;padding:12px;align-items:center;justify-content:center}.modal.open{display:flex}.modalbox{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff8e9;border-radius:15px;padding:16px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:7px}.opt{padding:11px;border-radius:9px;background:#eadcc7;font-weight:800}.opt.selected{background:#a90b0b;color:#fff}textarea{width:100%;min-height:65px;border:1px solid #cdb48f;border-radius:8px;padding:9px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.product img{height:180px}}
@media(max-width:480px){main{padding:7px}.grid{gap:7px}.product img{height:145px}.name{font-size:14px}.price{font-size:16px}.brand{font-size:22px}}
@media print{body *{visibility:hidden!important}#receipt,#receipt *{visibility:visible!important}#receipt{display:block!important;position:absolute;left:0;top:0;width:72mm;padding:2mm;font-family:monospace}}#receipt{display:none}
</style></head><body>
<header><div class="brand">Restaurante e Lanchonete ABENÇOADA</div><div class="tag">Comida caseira feita com amor!</div>
<nav><button class="active" onclick="screen('atendimento',this)">Atendimento</button><button onclick="screen('cozinha',this)">Cozinha</button><button onclick="screen('senhas',this)">Senhas</button></nav></header>
<main>
<section id="atendimento" class="screen active"><div class="layout"><div class="panel"><h2>Cardápio</h2><div id="cats" class="cats"></div><div id="grid" class="grid"></div></div>
<div class="panel"><h2>Pedido</h2><div id="cart"><span class="small">Nenhum item.</span></div><div class="total">Total: <span id="total">R$ 0,00</span></div><h3>Pagamento</h3><div class="payments"><button class="pay" onclick="paySel('Dinheiro',this)">Dinheiro</button><button class="pay" onclick="paySel('Pix',this)">Pix</button><button class="pay" onclick="paySel('Débito',this)">Débito</button><button class="pay" onclick="paySel('Crédito',this)">Crédito</button></div><br><button class="primary" onclick="finish()">Confirmar e imprimir senha</button><br><br><button class="secondary" style="width:100%" onclick="clearCart()">Limpar pedido</button></div></div></section>
<section id="cozinha" class="screen"><div class="panel"><h2>Pedidos da cozinha</h2><div id="kitchen"></div></div></section>
<section id="senhas" class="screen"><div class="panel"><h2>Senhas prontas</h2><div id="ready"></div></div></section>
</main>
<div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle"></h2><div id="modalBody"></div><h3>Observação</h3><textarea id="note" placeholder="Ex.: sem cebola, bem passado..."></textarea><br><br><button class="primary" onclick="addConfigured()">Adicionar</button><br><br><button class="secondary" style="width:100%" onclick="closeModal()">Cancelar</button></div></div>
<div id="receipt"></div>
<script>
var products=[{"cat": "Pratos", "name": "Parmegiana", "price": 22, "img": "assets/parmegiana.jpg", "type": "prato"}, {"cat": "Pratos", "name": "Bife Acebolado", "price": 22, "img": "assets/bife_acebolado.jpg", "type": "prato"}, {"cat": "Pratos", "name": "Frango à Milanesa", "price": 20, "img": "assets/frango_milanesa.jpg", "type": "prato"}, {"cat": "Pratos", "name": "Strogonoff", "price": 20, "img": "assets/strogonoff.jpg", "type": "prato"}, {"cat": "Marmitas", "name": "Marmita P", "price": 15, "img": "assets/frango_milanesa.jpg", "type": "marmita"}, {"cat": "Marmitas", "name": "Marmita M", "price": 20, "img": "assets/bife_acebolado.jpg", "type": "marmita"}, {"cat": "Marmitas", "name": "Marmita G", "price": 26, "img": "assets/strogonoff.jpg", "type": "marmita"}, {"cat": "Cuscuz", "name": "Cuscuz com Ovo + Café", "price": 8, "img": "assets/cuscuz_ovo.jpg", "type": "direto"}, {"cat": "Cuscuz", "name": "Cuscuz com Queijo + Café", "price": 8, "img": "assets/cuscuz_queijo.jpg", "type": "direto"}, {"cat": "Cuscuz", "name": "Cuscuz Queijo e Presunto + Café", "price": 8, "img": "assets/cuscuz_presunto.jpg", "type": "direto"}, {"cat": "Cuscuz", "name": "Cuscuz Completo + Café", "price": 10, "img": "assets/cuscuz_completo.jpg", "type": "direto"}, {"cat": "Lanches", "name": "Bolo + Café", "price": 8, "img": "assets/bolo_cafe.jpg", "type": "direto"}, {"cat": "Lanches", "name": "Sanduíche Natural + Suco ou Café", "price": 8, "img": "assets/sanduiche_natural.jpg", "type": "direto"}, {"cat": "Lanches", "name": "Misto Quente + Suco ou Café", "price": 8, "img": "assets/misto_quente.jpg", "type": "direto"}, {"cat": "Lanches", "name": "Pão de Sal com Carne + Suco ou Café", "price": 8, "img": "assets/pao_carne.jpg", "type": "direto"}, {"cat": "Tapiocas", "name": "Tapioca Queijo e Presunto + Suco ou Café", "price": 8, "img": "assets/tapioca_presunto.jpg", "type": "direto"}, {"cat": "Tapiocas", "name": "Tapioca de Queijo + Suco ou Café", "price": 8, "img": "assets/tapioca_queijo.jpg", "type": "direto"}, {"cat": "Tapiocas", "name": "Tapioca de Carne + Suco ou Café", "price": 10, "img": "assets/tapioca_carne.jpg", "type": "direto"}, {"cat": "Salgados", "name": "Coxinha de Frango + Suco", "price": 7, "img": "assets/coxinha.jpg", "type": "direto"}, {"cat": "Salgados", "name": "Pastel Queijo/Presunto + Suco", "price": 10, "img": "assets/pastel_queijo.jpg", "type": "direto"}, {"cat": "Salgados", "name": "Pastel Frango/Carne + Suco", "price": 12, "img": "assets/pastel_carne.jpg", "type": "direto"}, {"cat": "Salgados", "name": "Salgado Assado + Suco", "price": 10, "img": "assets/salgado_assado.jpg", "type": "direto"}, {"cat": "Vitaminas", "name": "Vitamina de Abacate + Whey", "price": 10, "img": "assets/vitamina_abacate.jpg", "type": "direto"}, {"cat": "Vitaminas", "name": "Vitamina de Morango + Whey", "price": 10, "img": "assets/vitamina_morango.jpg", "type": "direto"}, {"cat": "Vitaminas", "name": "Vitamina de Banana + Whey", "price": 10, "img": "assets/vitamina_banana.jpg", "type": "direto"}, {"cat": "Vitaminas", "name": "Vitamina de Manga + Whey", "price": 10, "img": "assets/vitamina_manga.jpg", "type": "direto"}]; var category="Pratos", cart=[], payment="", draft=null, protein="", sides=[];
var orders=[];try{orders=JSON.parse(localStorage.getItem("ab_v4_orders")||"[]")||[]}catch(e){orders=[]}
function money(v){return "R$ "+Number(v).toFixed(2).replace(".",",")}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function today(){var d=new Date(),m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function save(){try{localStorage.setItem("ab_v4_orders",JSON.stringify(orders))}catch(e){}}
function renderCats(){var a=["Pratos","Marmitas","Cuscuz","Lanches","Tapiocas","Salgados","Vitaminas"];document.getElementById("cats").innerHTML=a.map(function(c){return '<button class="cat '+(c===category?'active':'')+'" onclick="setCat(\''+c+'\')">'+c+'</button>'}).join("")}
function setCat(c){category=c;renderCats();renderGrid()}
function renderGrid(){var a=products.filter(function(p){return p.cat===category});document.getElementById("grid").innerHTML=a.map(function(p,i){var idx=products.indexOf(p);return '<button class="product" onclick="pick('+idx+')"><img src="'+p.img+'"><div class="info"><div class="name">'+esc(p.name)+'</div><div class="price">'+money(p.price)+'</div></div></button>'}).join("")}
function pick(i){var p=products[i];if(p.type==="direto"){cart.push({name:p.name,price:p.price,detail:""});renderCart();return}draft=p;document.getElementById("modalTitle").textContent=p.name;document.getElementById("note").value="";protein="";sides=[];if(p.type==="prato"){document.getElementById("modalBody").innerHTML='<p><b>Prato servido no restaurante.</b></p><p class="small">Use a observação somente se o cliente pedir alguma alteração.</p>'}else{document.getElementById("modalBody").innerHTML='<h3>Proteína</h3><div class="options"><button class="opt prot" onclick="prot(\'Frango à Milanesa\',this)">Frango à Milanesa</button><button class="opt prot" onclick="prot(\'Strogonoff\',this)">Strogonoff</button><button class="opt prot" onclick="prot(\'Bife Acebolado\',this)">Bife Acebolado</button><button class="opt prot" onclick="prot(\'Parmegiana\',this)">Parmegiana</button></div><h3>Acompanhamentos</h3><div class="options"><button class="opt side" onclick="side(\'Arroz\',this)">Arroz</button><button class="opt side" onclick="side(\'Feijão\',this)">Feijão</button><button class="opt side" onclick="side(\'Macarrão\',this)">Macarrão</button><button class="opt side" onclick="side(\'Salada\',this)">Salada</button></div>'}document.getElementById("modal").className="modal open"}
function prot(x,b){protein=x;var a=document.getElementsByClassName("prot");for(var i=0;i<a.length;i++)a[i].className="opt prot";b.className="opt prot selected"}
function side(x,b){var i=sides.indexOf(x);if(i>=0){sides.splice(i,1);b.className="opt side"}else{sides.push(x);b.className="opt side selected"}}
function closeModal(){document.getElementById("modal").className="modal"}
function addConfigured(){var note=document.getElementById("note").value;if(draft.type==="marmita"&&!protein){alert("Escolha a proteína.");return}var detail=draft.type==="prato"?"PRATO NO RESTAURANTE"+(note?" | Obs.: "+note:""):"Proteína: "+protein+" | Acompanhamentos: "+(sides.length?sides.join(", "):"nenhum")+(note?" | Obs.: "+note:"");cart.push({name:draft.name,price:draft.price,detail:detail});closeModal();renderCart()}
function renderCart(){var h="";for(var i=0;i<cart.length;i++)h+='<div class="line"><b>'+esc(cart[i].name)+'</b><div class="small">'+esc(cart[i].detail)+'</div></div>';document.getElementById("cart").innerHTML=h||'<span class="small">Nenhum item.</span>';var t=0;for(i=0;i<cart.length;i++)t+=cart[i].price;document.getElementById("total").textContent=money(t)}
function paySel(p,b){payment=p;var a=document.getElementsByClassName("pay");for(var i=0;i<a.length;i++)a[i].className="pay";b.className="pay selected"}
function clearCart(){cart=[];payment="";renderCart();var a=document.getElementsByClassName("pay");for(var i=0;i<a.length;i++)a[i].className="pay"}
function nextNum(){var max=0,d=today();for(var i=0;i<orders.length;i++)if(orders[i].day===d&&orders[i].num>max)max=orders[i].num;return max+1}
function finish(){if(!cart.length)return alert("Selecione um item.");if(!payment)return alert("Escolha o pagamento.");var n=nextNum(),t=0;for(var i=0;i<cart.length;i++)t+=cart[i].price;var o={id:String(Date.now())+Math.random(),day:today(),num:n,ticket:"A"+("000"+n).slice(-3),items:cart.slice(),payment:payment,total:t,status:"preparo"};orders.unshift(o);save();printReceipt(o);clearCart();renderKitchen();renderReady()}
function printReceipt(o){var h='<div style="text-align:center"><b>RESTAURANTE E LANCHONETE ABENÇOADA</b><hr><div style="font-size:34px;font-weight:900">SENHA '+o.ticket+'</div><hr></div>';for(var i=0;i<o.items.length;i++)h+='<b>'+esc(o.items[i].name)+'</b><br>'+esc(o.items[i].detail)+'<br><br>';h+='<hr><b>TOTAL: '+money(o.total)+'</b><br>Pagamento: '+o.payment;document.getElementById("receipt").innerHTML=h;window.print()}
function renderKitchen(){var h="",d=today();for(var i=0;i<orders.length;i++){var o=orders[i];if(o.day!==d||o.status==="entregue")continue;h+='<div class="ticketcard '+(o.status==="pronto"?"ready":"")+'"><div class="ticket">'+o.ticket+'</div><b>'+(o.status==="pronto"?"PRONTO":"EM PREPARO")+'</b><hr>';for(var j=0;j<o.items.length;j++)h+='<p><b>'+esc(o.items[j].name)+'</b><br>'+esc(o.items[j].detail).split(" | ").join("<br>")+'</p>';h+=o.status==="preparo"?'<button class="primary" onclick="ready(\''+o.id+'\')">PRONTO</button>':'<button class="secondary" onclick="delivered(\''+o.id+'\')">ENTREGUE</button>';h+='</div>'}document.getElementById("kitchen").innerHTML=h||"Nenhum pedido ativo."}
function ready(id){for(var i=0;i<orders.length;i++)if(orders[i].id===id)orders[i].status="pronto";save();renderKitchen();renderReady()}
function delivered(id){for(var i=0;i<orders.length;i++)if(orders[i].id===id)orders[i].status="entregue";save();renderKitchen();renderReady()}
function renderReady(){var h="",d=today();for(var i=0;i<orders.length;i++)if(orders[i].day===d&&orders[i].status==="pronto")h+='<div class="readybox"><div>SENHA</div><div class="ticket">'+orders[i].ticket+'</div><b>PRONTO PARA RETIRADA</b></div>';document.getElementById("ready").innerHTML=h||"Nenhuma senha pronta."}
function screen(id,b){var a=document.getElementsByClassName("screen");for(var i=0;i<a.length;i++)a[i].className="screen";document.getElementById(id).className="screen active";var n=document.querySelectorAll("nav button");for(i=0;i<n.length;i++)n[i].className="";b.className="active"}
renderCats();renderGrid();renderCart();renderKitchen();renderReady();
</script></body></html>
